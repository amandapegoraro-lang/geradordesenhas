
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Gerador de Senhas</h1>
        <p>Crie sua senha personalizada!</p>

        <label for="senha">Senha gerada:</label>
        <input type="text" id="senha" readonly>

        <label for="tamanho">Tamanho da senha:</label>
        <input type="number" id="tamanho" value="12" min="1" max="50">

        <div class="opcoes">

            <h3>Tipos de caracteres:</h3>

            <label>
                <input type="checkbox" id="maiusculas" checked>
                Letras maiusculas (A-Z)
            </label>

            <label>
                <input type="checkbox" id="minusculas" checked>
                Letras minusculas (a-z)
            </label>

            <label>
                <input type="checkbox" id="numeros" checked>
                Numeros (0-9)
            </label>

            <label>
                <input type="checkbox" id="especiais">
                Caracteres especiais (!@#$%)
            </label>

        </div>

        <button id="gerar">Gerar senha</button>

        <button id="limpar">Limpar</button>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
